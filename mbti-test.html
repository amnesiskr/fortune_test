<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fdf4ff" />
  <title>🧩 MBTI 성격 유형 검사</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

    :root {
      --ei: #6366f1; /* E/I - 인디고 */
      --sn: #f59e0b; /* S/N - 앰버 */
      --tf: #10b981; /* T/F - 에메랄드 */
      --jp: #ec4899; /* J/P - 핑크 */
      --white: #ffffff;
      --text:  #1e1b4b;
      --muted: #64748b;
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100dvh;
      background: linear-gradient(160deg, #fdf4ff 0%, #ede9fe 45%, #e0f2fe 100%);
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      padding: calc(var(--safe-top) + 20px) 16px calc(var(--safe-bottom) + 40px);
      overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(circle at 80% 10%, rgba(99,102,241,.1) 0%, transparent 50%),
        radial-gradient(circle at 15% 80%, rgba(236,72,153,.08) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }

    .container { position: relative; z-index: 1; width: 100%; max-width: 500px; margin: 0 auto; }

    /* ── 타이틀 ── */
    .title-area { text-align: center; margin-bottom: 24px; }
    .title-icon {
      font-size: 60px; display: block; margin-bottom: 10px; line-height: 1;
      animation: bounce 2.2s ease-in-out infinite;
      filter: drop-shadow(0 4px 14px rgba(99,102,241,.3));
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0) scale(1); }
      40%      { transform: translateY(-12px) scale(1.07); }
      60%      { transform: translateY(-6px)  scale(1.04); }
    }
    h1 {
      font-size: clamp(22px, 6.5vw, 30px); font-weight: 900;
      background: linear-gradient(135deg, #6366f1, #ec4899, #f59e0b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; letter-spacing: 2px;
    }
    .subtitle { margin-top: 6px; font-size: 13px; color: var(--muted); letter-spacing: 1px; }

    /* ── 카드 ── */
    .card {
      background: var(--white); border-radius: 28px;
      padding: 26px 20px 22px;
      box-shadow: 0 8px 32px rgba(99,102,241,.12), 0 2px 8px rgba(0,0,0,.05);
      border: 2px solid rgba(99,102,241,.1);
    }

    /* 지표 배지 */
    .dim-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .dim-chip {
      font-size: 12px; font-weight: 900; padding: 6px 14px;
      border-radius: 99px; letter-spacing: .5px;
    }
    .dc-ei { background:#eef2ff; color:#4338ca; border: 1.5px solid #c7d2fe; }
    .dc-sn { background:#fffbeb; color:#b45309; border: 1.5px solid #fde68a; }
    .dc-tf { background:#ecfdf5; color:#065f46; border: 1.5px solid #a7f3d0; }
    .dc-jp { background:#fdf2f8; color:#be185d; border: 1.5px solid #fbcfe8; }

    .intro-list {
      list-style: none; margin: 0 0 22px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .intro-list li {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; background: #f5f3ff; border-radius: 12px; padding: 10px 14px;
    }
    .intro-list li span { font-size: 20px; }

    .btn {
      width: 100%; padding: 17px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      border: none; border-radius: 18px; color: #fff;
      font-size: 16px; font-family: inherit; font-weight: 900;
      letter-spacing: 2px; cursor: pointer;
      transition: filter .15s, transform .15s, box-shadow .15s;
      min-height: 56px; touch-action: manipulation;
      box-shadow: 0 6px 20px rgba(99,102,241,.3);
    }
    .btn:hover  { filter: brightness(1.07); }
    .btn:active { transform: scale(0.96); filter: brightness(0.96); box-shadow: none; }

    /* ── 진행바 ── */
    .progress-wrap { margin-bottom: 18px; }
    .progress-meta {
      display: flex; justify-content: space-between;
      font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px;
    }
    .progress-bar { height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
    .progress-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, #6366f1, #ec4899);
      transition: width .4s cubic-bezier(.22,.68,0,1.2);
    }

    /* ── 문항 카드 ── */
    .q-card {
      background: var(--white); border-radius: 24px;
      padding: 24px 18px 20px;
      box-shadow: 0 6px 28px rgba(99,102,241,.1), 0 2px 6px rgba(0,0,0,.04);
      border: 2px solid rgba(99,102,241,.08);
      animation: slideIn .35s cubic-bezier(.22,.68,0,1.2);
    }
    @keyframes slideIn {
      from { opacity:0; transform: translateX(22px) scale(.97); }
      to   { opacity:1; transform: translateX(0)    scale(1);   }
    }

    .q-dim-badge {
      display: inline-block; font-size: 11px; font-weight: 900;
      padding: 4px 12px; border-radius: 99px; margin-bottom: 12px; letter-spacing: .5px;
    }
    .q-text {
      font-size: 16px; font-weight: 700; line-height: 1.75;
      color: var(--text); margin-bottom: 20px; word-break: keep-all;
    }

    /* A/B 선택지 카드 */
    .ab-wrap { display: flex; flex-direction: column; gap: 10px; }
    .ab-btn {
      width: 100%; padding: 16px 16px;
      background: #f8faff; border: 2px solid #e2e8f0;
      border-radius: 18px; cursor: pointer; text-align: left;
      font-family: inherit; transition: border-color .15s, background .15s, transform .1s;
      touch-action: manipulation; min-height: 58px;
    }
    .ab-btn:hover  { border-color: #a5b4fc; background: #eef2ff; }
    .ab-btn:active { transform: scale(0.97); }
    .ab-btn.chosen-a { border-color: var(--ei); background: #eef2ff; }
    .ab-btn.chosen-b { border-color: var(--ei); background: #eef2ff; }

    .ab-label {
      display: inline-block; font-size: 11px; font-weight: 900;
      padding: 2px 8px; border-radius: 6px; margin-right: 8px;
      vertical-align: middle;
    }
    .ab-label-a { background: #e0e7ff; color: #3730a3; }
    .ab-label-b { background: #fce7f3; color: #9d174d; }
    .ab-text { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.55; word-break: keep-all; }

    /* ── 결과 ── */
    .result-card {
      background: var(--white); border-radius: 28px;
      padding: 30px 20px 32px;
      box-shadow: 0 8px 32px rgba(99,102,241,.13), 0 2px 8px rgba(0,0,0,.05);
      border: 2px solid rgba(99,102,241,.12);
      animation: popIn .45s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn {
      from { opacity:0; transform: scale(.88) translateY(16px); }
      to   { opacity:1; transform: scale(1)   translateY(0);    }
    }

    /* MBTI 타입 배너 */
    .type-banner {
      text-align: center; margin-bottom: 22px;
    }
    .type-emoji { font-size: 56px; display: block; margin-bottom: 10px; }
    .type-code {
      font-size: clamp(42px, 12vw, 58px); font-weight: 900; letter-spacing: 6px;
      line-height: 1; margin-bottom: 6px;
    }
    .type-name-kor {
      font-size: 16px; font-weight: 900; color: var(--muted);
      letter-spacing: 1px; margin-bottom: 14px;
    }
    .type-tag {
      display: inline-block; padding: 6px 20px; border-radius: 99px;
      font-size: 13px; font-weight: 900; letter-spacing: .5px;
      color: #fff; margin-bottom: 6px;
    }

    /* 4축 비율 바 */
    .axes-section { margin: 20px 0; }
    .axis-row { margin-bottom: 14px; }
    .axis-labels {
      display: flex; justify-content: space-between;
      font-size: 12px; font-weight: 900; margin-bottom: 5px;
    }
    .axis-bar-wrap {
      position: relative; height: 14px; background: #e2e8f0;
      border-radius: 99px; overflow: hidden;
    }
    .axis-bar-fill {
      position: absolute; top: 0; height: 100%; border-radius: 99px;
      transition: width .9s cubic-bezier(.22,.68,0,1.2);
    }
    .axis-center {
      position: absolute; top: 0; left: 50%; width: 2px; height: 100%;
      background: #fff; z-index: 1;
    }
    .axis-pct {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 3px;
    }

    /* 유형 설명 */
    .type-desc-box {
      background: linear-gradient(135deg, #f5f3ff, #fdf2f8);
      border-radius: 18px; padding: 16px;
      font-size: 14px; line-height: 1.85;
      color: #374151; margin-bottom: 20px; word-break: keep-all;
    }

    /* 강점/약점 */
    .sw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .sw-card { border-radius: 16px; padding: 14px 12px; }
    .sw-card.strength { background: #ecfdf5; border: 1.5px solid #a7f3d0; }
    .sw-card.weakness { background: #fef2f2; border: 1.5px solid #fecaca; }
    .sw-title { font-size: 12px; font-weight: 900; margin-bottom: 8px; }
    .sw-card.strength .sw-title { color: #065f46; }
    .sw-card.weakness .sw-title { color: #991b1b; }
    .sw-list { list-style: none; }
    .sw-list li { font-size: 12px; color: #374151; line-height: 1.6; }
    .sw-list li::before { content: '• '; }

    /* 궁합 */
    .compat-section { margin-bottom: 20px; }
    .compat-title { font-size: 12px; font-weight: 900; color: var(--muted); letter-spacing: 1.5px; margin-bottom: 10px; }
    .compat-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .compat-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 12px; border-radius: 99px;
      font-size: 12px; font-weight: 900;
    }
    .compat-best  { background: #dcfce7; color: #15803d; border:1.5px solid #86efac; }
    .compat-good  { background: #dbeafe; color: #1d4ed8; border:1.5px solid #93c5fd; }
    .compat-avoid { background: #fee2e2; color: #b91c1c; border:1.5px solid #fca5a5; }

    /* 유명인 */
    .celeb-section { margin-bottom: 22px; }
    .celeb-title { font-size: 12px; font-weight: 900; color: var(--muted); letter-spacing: 1.5px; margin-bottom: 8px; }
    .celeb-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .celeb-chip {
      font-size: 12px; font-weight: 700; padding: 5px 12px;
      background: #f1f5f9; border-radius: 99px; color: #475569;
      border: 1.5px solid #e2e8f0;
    }

    /* 링크 버튼 */
    .link-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 15px; border-radius: 16px;
      font-size: 14px; font-family: inherit; font-weight: 700;
      text-decoration: none; cursor: pointer;
      touch-action: manipulation; transition: filter .15s, transform .12s;
      margin-top: 10px; border: none;
    }
    .link-btn:active { transform: scale(0.97); }
    .link-btn.fortune { background: linear-gradient(135deg,#ff7eb3,#b17afe); color:#fff; box-shadow:0 4px 16px rgba(255,126,179,.3); }
    .link-btn.fortune:hover { filter: brightness(1.07); }
    .link-btn.iq      { background: linear-gradient(135deg,#4f8ef7,#8b5cf6); color:#fff; box-shadow:0 4px 16px rgba(79,142,247,.3); }
    .link-btn.iq:hover      { filter: brightness(1.07); }
    .link-btn.tci     { background: linear-gradient(135deg,#8b5cf6,#ec4899); color:#fff; box-shadow:0 4px 16px rgba(139,92,246,.3); }
    .link-btn.tci:hover     { filter: brightness(1.07); }
    .link-btn.retry   { background:#fff; border:2px solid #c7d2fe; color:#4338ca; }
    .link-btn.retry:hover   { background:#eef2ff; }

    /* 섹션 */
    #intro-section, #quiz-section, #result-section { display: none; }
    #intro-section.active, #quiz-section.active, #result-section.active { display: block; }
  </style>
</head>
<body>
<div class="container">

  <div class="title-area">
    <span class="title-icon">🧩</span>
    <h1>MBTI 성격 유형 검사</h1>
    <p class="subtitle">나는 16가지 중 어떤 유형일까?</p>
  </div>

  <!-- 시작 -->
  <div id="intro-section" class="active">
    <div class="card">
      <div class="dim-row">
        <span class="dim-chip dc-ei">E 외향 vs I 내향</span>
        <span class="dim-chip dc-sn">S 감각 vs N 직관</span>
        <span class="dim-chip dc-tf">T 사고 vs F 감정</span>
        <span class="dim-chip dc-jp">J 판단 vs P 인식</span>
      </div>
      <ul class="intro-list">
        <li><span>📝</span> 총 60문항 (각 지표 15문항)</li>
        <li><span>🔀</span> A / B 중 더 가까운 것을 선택</li>
        <li><span>💡</span> 솔직하게! 정답은 없어요</li>
        <li><span>📊</span> 16가지 유형 + 강점·약점·궁합 분석</li>
      </ul>
      <button class="btn" onclick="startQuiz()">🧩 검사 시작하기</button>
      <a href="fortune.html" style="display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;margin-top:10px;padding:15px;border-radius:18px;font-size:14px;font-family:inherit;font-weight:700;background:#fff;border:2px solid #c7d2fe;color:#4338ca;">
        🔮 오늘의 운세 보러가기
      </a>
    </div>
  </div>

  <!-- 퀴즈 -->
  <div id="quiz-section">
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="q-counter">1 / 60</span>
        <span id="q-dim-label"></span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
    <div class="q-card" id="q-card">
      <span class="q-dim-badge" id="q-badge"></span>
      <div class="q-text" id="q-text"></div>
      <div class="ab-wrap" id="ab-wrap"></div>
    </div>
  </div>

  <!-- 결과 -->
  <div id="result-section">
    <div class="result-card">
      <div class="type-banner">
        <span class="type-emoji"  id="type-emoji"></span>
        <div  class="type-code"   id="type-code"></div>
        <div  class="type-name-kor" id="type-name-kor"></div>
        <span class="type-tag"    id="type-tag"></span>
      </div>
      <div class="axes-section"  id="axes-section"></div>
      <div class="type-desc-box" id="type-desc"></div>
      <div class="sw-grid"       id="sw-grid"></div>
      <div class="compat-section" id="compat-section"></div>
      <div class="celeb-section"  id="celeb-section"></div>
      <a href="fortune.html" class="link-btn fortune">🔮 오늘의 운세 확인하기</a>
      <a href="iq-test.html"  class="link-btn iq">🧠 IQ 테스트 하러가기</a>
      <a href="tci-test.html" class="link-btn tci">🌈 TCI 기질·성격 검사</a>
      <button class="link-btn retry" onclick="restartQuiz()">↺ 다시 검사하기</button>
    </div>
  </div>

</div>
<script>
// ── 문항 풀 (60문항, E/I·S/N·T/F·J/P 각 15문항) ──────────
// pole: 'a'→첫 번째 극(E,S,T,J) 'b'→두 번째 극(I,N,F,P)
const QUESTIONS = [
  /* E(a) vs I(b) ── 15문항 */
  { dim:'EI', a:'사람들과 어울리면 에너지가 충전된다.', b:'혼자 있는 시간이 있어야 에너지가 회복된다.' },
  { dim:'EI', a:'처음 보는 사람과도 쉽게 대화를 시작한다.', b:'낯선 사람과의 대화가 피곤하게 느껴질 때가 많다.' },
  { dim:'EI', a:'말하면서 생각이 정리되는 편이다.', b:'생각을 먼저 정리한 후에 말한다.' },
  { dim:'EI', a:'여럿이 함께하는 모임이 즐겁다.', b:'소수와 깊은 대화를 나누는 게 좋다.' },
  { dim:'EI', a:'감정이나 생각을 밖으로 잘 표현하는 편이다.', b:'속으로 많이 생각하고 겉으로는 잘 드러내지 않는다.' },
  { dim:'EI', a:'주목받는 상황이 어색하지 않다.', b:'주목받으면 불편하고 부담스럽다.' },
  { dim:'EI', a:'새로운 사람을 많이 만나는 것이 즐겁다.', b:'아는 소수의 사람과 깊이 지내는 것을 선호한다.' },
  { dim:'EI', a:'파티나 단체 행사에서 활기를 느낀다.', b:'파티나 단체 행사 후에 피곤함을 느낀다.' },
  { dim:'EI', a:'여러 일을 동시에 추진하는 것이 자연스럽다.', b:'한 가지에 집중하는 편이 훨씬 효과적이다.' },
  { dim:'EI', a:'침묵이 불편해서 대화를 이어가려 한다.', b:'침묵이 불편하지 않고 오히려 편안하다.' },
  { dim:'EI', a:'친구가 많을수록 좋다고 생각한다.', b:'깊고 신뢰할 수 있는 친구 몇 명이면 충분하다.' },
  { dim:'EI', a:'생각보다 행동이 먼저 나오는 경우가 있다.', b:'행동하기 전에 충분히 계획하고 검토한다.' },
  { dim:'EI', a:'다양한 활동에 적극적으로 참여하는 편이다.', b:'선택적으로 활동하며 에너지를 아끼는 편이다.' },
  { dim:'EI', a:'밖에서 사람들과 어울리는 시간이 좋다.', b:'집에서 혼자 보내는 시간이 제일 편하다.' },
  { dim:'EI', a:'즉흥적인 사교 활동을 즐긴다.', b:'미리 약속이 잡혀 있어야 마음의 준비가 된다.' },

  /* S(a) vs N(b) ── 15문항 */
  { dim:'SN', a:'현재 일어나고 있는 사실과 세부 사항을 중요하게 본다.', b:'미래의 가능성이나 아이디어에 더 관심이 많다.' },
  { dim:'SN', a:'경험에서 배우고 과거의 방법을 신뢰한다.', b:'새로운 방법을 시도하고 기존 방식에 의문을 품는다.' },
  { dim:'SN', a:'단계별로 차근차근 진행하는 것을 선호한다.', b:'전체 그림을 먼저 그리고 세부 사항은 나중에 챙긴다.' },
  { dim:'SN', a:'구체적이고 실용적인 정보가 더 유용하다고 느낀다.', b:'추상적인 개념이나 이론을 탐구하는 것이 재미있다.' },
  { dim:'SN', a:'지금 이 순간에 집중하는 편이다.', b:'미래에 어떻게 될지 자주 상상한다.' },
  { dim:'SN', a:'반복되는 일도 꾸준히 잘 수행할 수 있다.', b:'새롭고 창의적인 일을 할 때 더욱 열정이 생긴다.' },

// ── 상태 ─────────────────────────────────────────────────
let current = 0;
let scores  = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };

const TOTAL = QUESTIONS.length;

function startQuiz() {
  current = 0;
  scores  = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
  show('quiz-section');
  renderQ();
}

const DIM_COLORS = { EI:'#6366f1', SN:'#f59e0b', TF:'#10b981', JP:'#ec4899' };
const DIM_LABELS = { EI:'외향 vs 내향', SN:'감각 vs 직관', TF:'사고 vs 감정', JP:'판단 vs 인식' };
const DIM_BADGE_CLS = { EI:'dc-ei', SN:'dc-sn', TF:'dc-tf', JP:'dc-jp' };

function renderQ() {
  const q = QUESTIONS[current];

  document.getElementById('q-counter').textContent     = `${current+1} / ${TOTAL}`;
  document.getElementById('q-dim-label').textContent   = DIM_LABELS[q.dim];
  document.getElementById('progress-fill').style.width = `${(current/TOTAL)*100}%`;

  const badge = document.getElementById('q-badge');
  badge.textContent = DIM_LABELS[q.dim];
  badge.className   = `q-dim-badge ${DIM_BADGE_CLS[q.dim]}`;
  badge.style.color = DIM_COLORS[q.dim];

  document.getElementById('q-text').textContent = '다음 중 나에게 더 가까운 것은?';

  const abWrap = document.getElementById('ab-wrap');
  abWrap.innerHTML = `
    <button class="ab-btn" id="btn-a" onclick="selectAB('a')">
      <span class="ab-label ab-label-a">A</span>
      <span class="ab-text">${q.a}</span>
    </button>
    <button class="ab-btn" id="btn-b" onclick="selectAB('b')">
      <span class="ab-label ab-label-b">B</span>
      <span class="ab-text">${q.b}</span>
    </button>
  `;

  const card = document.getElementById('q-card');
  card.style.animation = 'none'; card.offsetHeight; card.style.animation = '';
}

function selectAB(choice) {
  const q = QUESTIONS[current];
  document.getElementById('btn-a').disabled = true;
  document.getElementById('btn-b').disabled = true;

  if (choice === 'a') {
    document.getElementById('btn-a').style.borderColor = DIM_COLORS[q.dim];
    document.getElementById('btn-a').style.background  = '#eef2ff';
    // a → 첫 번째 극 (E,S,T,J)
    const pole = q.dim[0];  // 'E','S','T','J'
    scores[pole]++;
  } else {
    document.getElementById('btn-b').style.borderColor = DIM_COLORS[q.dim];
    document.getElementById('btn-b').style.background  = '#fdf2f8';
    // b → 두 번째 극 (I,N,F,P)
    const pole = q.dim[1];  // 'I','N','F','P'
    scores[pole]++;
  }

  setTimeout(() => {
    current++;
    if (current >= TOTAL) showResult();
    else {
      renderQ();
      document.getElementById('q-card').scrollIntoView({ behavior:'smooth', block:'start' });
    }
  }, 380);
}

function showResult() {
  const E = scores.E, I = scores.I;
  const S = scores.S, N = scores.N;
  const T = scores.T, F = scores.F;
  const J = scores.J, P = scores.P;

  const type =
    (E >= I ? 'E' : 'I') +
    (S >= N ? 'S' : 'N') +
    (T >= F ? 'T' : 'F') +
    (J >= P ? 'J' : 'P');

  const data = MBTI_DATA[type];
  const dimColors = ['#6366f1','#f59e0b','#10b981','#ec4899'];

  // 배너
  document.getElementById('type-emoji').textContent   = data.emoji;
  document.getElementById('type-code').textContent    = type;
  document.getElementById('type-code').style.background =
    `linear-gradient(135deg, ${data.color}, #ec4899)`;
  document.getElementById('type-code').style['-webkit-background-clip'] = 'text';
  document.getElementById('type-code').style['-webkit-text-fill-color'] = 'transparent';
  document.getElementById('type-code').style['background-clip'] = 'text';
  document.getElementById('type-name-kor').textContent = data.name;
  const tagEl = document.getElementById('type-tag');
  tagEl.textContent = data.tag;
  tagEl.style.background = `linear-gradient(135deg, ${data.color}, #ec4899)`;

  // 4축 비율 바
  const axes = [
    { left:'E', right:'I', lScore:E, rScore:I, color:'#6366f1' },
    { left:'S', right:'N', lScore:S, rScore:N, color:'#f59e0b' },
    { left:'T', right:'F', lScore:T, rScore:F, color:'#10b981' },
    { left:'J', right:'P', lScore:J, rScore:P, color:'#ec4899' },
  ];
  const axisLabels = {
    E:'외향(E)', I:'내향(I)', S:'감각(S)', N:'직관(N)',
    T:'사고(T)', F:'감정(F)', J:'판단(J)', P:'인식(P)'
  };

  document.getElementById('axes-section').innerHTML = axes.map(ax => {
    const total = ax.lScore + ax.rScore || 1;
    const lPct  = Math.round(ax.lScore / total * 100);
    const rPct  = 100 - lPct;
    const winner = ax.lScore >= ax.rScore ? ax.left : ax.right;
    // 우세한 방향으로 바를 채움 (왼쪽 우세 → left 정렬, 오른쪽 우세 → right 정렬)
    const fillLeft = ax.lScore >= ax.rScore;
    return `
      <div class="axis-row">
        <div class="axis-labels">
          <span style="color:${ax.lScore>=ax.rScore?ax.color:'#94a3b8'};font-size:${ax.lScore>=ax.rScore?'13px':'11px'}">${axisLabels[ax.left]}</span>
          <span style="color:${ax.rScore>ax.lScore?ax.color:'#94a3b8'};font-size:${ax.rScore>ax.lScore?'13px':'11px'}">${axisLabels[ax.right]}</span>
        </div>
        <div class="axis-bar-wrap">
          <div class="axis-center"></div>
          <div class="axis-bar-fill" style="
            width:${fillLeft ? lPct : rPct}%;
            background:${ax.color};
            ${fillLeft ? 'left:0' : 'right:0;left:auto'};
          "></div>
        </div>
        <div class="axis-pct">
          <span style="color:${ax.lScore>=ax.rScore?ax.color:'#94a3b8'}">${lPct}%</span>
          <span style="color:${ax.rScore>ax.lScore?ax.color:'#94a3b8'}">${rPct}%</span>
        </div>
      </div>
    `;
  }).join('');

  // 설명
  document.getElementById('type-desc').textContent = data.desc;

  // 강점·약점
  document.getElementById('sw-grid').innerHTML = `
    <div class="sw-card strength">
      <div class="sw-title">💪 강점</div>
      <ul class="sw-list">${data.strengths.map(s=>`<li>${s}</li>`).join('')}</ul>
    </div>
    <div class="sw-card weakness">
      <div class="sw-title">⚠️ 주의할 점</div>
      <ul class="sw-list">${data.weaknesses.map(w=>`<li>${w}</li>`).join('')}</ul>
    </div>
  `;

  // 궁합
  document.getElementById('compat-section').innerHTML = `
    <div class="compat-title">— 궁합 유형 —</div>
    <div class="compat-row">
      <span style="font-size:12px;font-weight:900;color:#64748b;align-self:center">최고의 짝</span>
      ${data.best.map(t=>`<span class="compat-chip compat-best">❤️ ${t}</span>`).join('')}
    </div>
    <div class="compat-row" style="margin-top:7px">
      <span style="font-size:12px;font-weight:900;color:#64748b;align-self:center">잘 맞는 편</span>
      ${data.good.map(t=>`<span class="compat-chip compat-good">👍 ${t}</span>`).join('')}
    </div>
    <div class="compat-row" style="margin-top:7px">
      <span style="font-size:12px;font-weight:900;color:#64748b;align-self:center">주의 필요</span>
      ${data.avoid.map(t=>`<span class="compat-chip compat-avoid">⚡ ${t}</span>`).join('')}
    </div>
  `;

  // 유명인
  document.getElementById('celeb-section').innerHTML = `
    <div class="celeb-title">— 같은 유형의 유명인 —</div>
    <div class="celeb-chips">
      ${data.celebs.map(c=>`<span class="celeb-chip">⭐ ${c}</span>`).join('')}
    </div>
  `;

  show('result-section');
  document.querySelector('.container').scrollIntoView({ behavior:'smooth', block:'start' });
}

function restartQuiz() { show('intro-section'); }

function show(id) {
  ['intro-section','quiz-section','result-section'].forEach(s =>
    document.getElementById(s).classList.remove('active')
  );
  document.getElementById(id).classList.add('active');
}
</script>
