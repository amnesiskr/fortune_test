<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fff0f8" />
  <title>✨ 오늘의 운세</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

    :root {
      --pink:    #ff7eb3;
      --purple:  #b17afe;
      --blue:    #74b9ff;
      --mint:    #55efc4;
      --yellow:  #ffeaa7;
      --orange:  #ffb347;
      --bg:      #fff0f8;
      --white:   #ffffff;
      --text:    #3d2c5e;
      --muted:   #9b8bb4;
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100dvh;
      background: linear-gradient(180deg, #ffe4f3 0%, #f0e6ff 40%, #e4f0ff 100%);
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      padding: calc(var(--safe-top) + 20px) 16px calc(var(--safe-bottom) + 40px);
      overflow-x: hidden;
    }

    /* 배경 동글뱅이 장식 */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 300px; height: 300px;
      top: -80px; right: -80px;
      background: radial-gradient(circle, rgba(255,126,179,0.18) 0%, transparent 70%);
    }
    body::after {
      width: 260px; height: 260px;
      bottom: -60px; left: -60px;
      background: radial-gradient(circle, rgba(116,185,255,0.2) 0%, transparent 70%);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    /* ── 타이틀 ── */
    .title-area { text-align: center; margin-bottom: 24px; }

    .title-icon {
      font-size: 64px;
      display: block;
      line-height: 1;
      margin-bottom: 12px;
      animation: wiggle 2.4s ease-in-out infinite;
      filter: drop-shadow(0 4px 12px rgba(255,126,179,0.4));
    }

    @keyframes wiggle {
      0%,100% { transform: rotate(-8deg) scale(1);   }
      25%      { transform: rotate(8deg)  scale(1.08); }
      50%      { transform: rotate(-4deg) scale(1.04); }
      75%      { transform: rotate(6deg)  scale(1.06); }
    }

    h1 {
      font-size: clamp(24px, 7vw, 32px);
      font-weight: 900;
      background: linear-gradient(135deg, #ff7eb3, #b17afe, #74b9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 3px;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 2px;
      font-weight: 500;
    }

    /* ── 입력 카드 ── */
    .card {
      background: var(--white);
      border-radius: 28px;
      padding: 28px 20px 24px;
      box-shadow: 0 8px 32px rgba(177,122,254,0.15), 0 2px 8px rgba(0,0,0,0.06);
      border: 2px solid rgba(255,126,179,0.15);
    }

    .form-group { margin-bottom: 20px; }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      background: #faf7ff;
      border: 2px solid #e8d8ff;
      border-radius: 16px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    input[type="text"]::placeholder { color: #c9b8e8; }
    input[type="text"]:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 4px rgba(177,122,254,0.12);
    }

    .date-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 8px;
    }

    select {
      width: 100%;
      padding: 14px 8px;
      background: #faf7ff;
      border: 2px solid #e8d8ff;
      border-radius: 16px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    select:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 4px rgba(177,122,254,0.12);
    }
    select option { background: #fff; color: var(--text); }

    .btn {
      width: 100%;
      padding: 17px;
      background: linear-gradient(135deg, #ff7eb3, #b17afe);
      border: none;
      border-radius: 18px;
      color: #fff;
      font-size: 17px;
      font-family: inherit;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s, box-shadow 0.15s;
      margin-top: 4px;
      touch-action: manipulation;
      min-height: 56px;
      box-shadow: 0 6px 20px rgba(255,126,179,0.35);
    }
    .btn:hover  { filter: brightness(1.06); box-shadow: 0 8px 24px rgba(255,126,179,0.45); }
    .btn:active { transform: scale(0.96); filter: brightness(0.97); box-shadow: none; }

    /* ── 결과 ── */
    #result { display: none; margin-top: 20px; }

    .result-card {
      background: var(--white);
      border-radius: 28px;
      padding: 26px 18px 30px;
      box-shadow: 0 8px 32px rgba(177,122,254,0.15), 0 2px 8px rgba(0,0,0,0.06);
      border: 2px solid rgba(255,126,179,0.15);
      animation: popIn 0.45s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.88) translateY(16px); }
      to   { opacity: 1; transform: scale(1)    translateY(0); }
    }

    /* 결과 헤더 */
    .result-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .result-header .name-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ffb3d4, #d4aaff);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      padding: 8px 22px;
      border-radius: 99px;
      letter-spacing: 1px;
      margin-bottom: 8px;
      box-shadow: 0 4px 12px rgba(255,126,179,0.3);
    }

    .result-header .rmeta {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    /* 사주 간지 */
    .ganzhi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .pillar {
      text-align: center;
      background: linear-gradient(135deg, #ffeef8, #f3eaff);
      border: 2px solid rgba(255,126,179,0.2);
      border-radius: 18px;
      padding: 12px 6px;
    }
    .pillar-label { font-size: 10px; color: var(--muted); font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px; }
    .pillar-char  { font-size: 26px; line-height: 1; }
    .pillar-sub   { font-size: 11px; color: var(--purple); margin-top: 4px; font-weight: 700; }

    /* 별자리 */
    .zodiac-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: linear-gradient(135deg, #fff7e6, #fff0f8);
      border: 2px solid rgba(255,179,71,0.25);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }
    .zodiac-icon { font-size: 40px; flex-shrink: 0; }
    .zodiac-info .sign      { font-size: 15px; font-weight: 900; color: var(--text); }
    .zodiac-info .sign-date { font-size: 11px; color: var(--orange); font-weight: 700; margin-top: 2px; }
    .zodiac-info .sign-desc { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }

    /* 운세 섹션 */
    .section-title {
      font-size: 11px;
      font-weight: 900;
      color: var(--muted);
      letter-spacing: 2px;
      text-align: center;
      margin: 18px 0 12px;
    }

    .fortune-list { display: flex; flex-direction: column; gap: 10px; }

    .fortune-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: #faf8ff;
      border-radius: 18px;
      padding: 14px 14px;
      border-left: 4px solid transparent;
    }
    .fortune-item.love   { border-color: #ff7eb3; background: #fff5f9; }
    .fortune-item.money  { border-color: #ffd32a; background: #fffbf0; }
    .fortune-item.health { border-color: #55efc4; background: #f0fff9; }
    .fortune-item.career { border-color: #74b9ff; background: #f0f8ff; }
    .fortune-item.total  { border-color: var(--purple); background: #f8f4ff; }

    .fortune-emoji { font-size: 26px; flex-shrink: 0; margin-top: 1px; }

    .fortune-text-wrap { flex: 1; }
    .fortune-label {
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .fortune-item.love   .fortune-label { color: #ff7eb3; }
    .fortune-item.money  .fortune-label { color: #e6a817; }
    .fortune-item.health .fortune-label { color: #00b894; }
    .fortune-item.career .fortune-label { color: #0984e3; }
    .fortune-item.total  .fortune-label { color: var(--purple); }

    .fortune-text {
      font-size: 13px;
      line-height: 1.8;
      color: #5a4a7a;
      word-break: keep-all;
    }

    /* 점수 그리드 */
    .score-section { margin-top: 18px; }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .score-item.full { grid-column: 1 / -1; }

    .score-item {
      background: linear-gradient(135deg, #ffeef8, #f3eaff);
      border-radius: 16px;
      padding: 12px 10px;
      text-align: center;
    }
    .s-label { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 0.5px; }
    .s-val   { font-size: 20px; font-weight: 900; margin-top: 3px; }
    .s-bar {
      height: 6px;
      background: rgba(177,122,254,0.15);
      border-radius: 99px;
      margin: 6px auto 0;
      width: 80%;
      overflow: hidden;
    }
    .s-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #ff7eb3, #b17afe);
    }

    /* 행운 아이템 */
    .lucky-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .lucky-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, #fffde7, #fff8f0);
      border: 2px solid rgba(255,179,71,0.25);
      border-radius: 18px;
      padding: 14px 6px;
      text-align: center;
    }
    .l-icon  { font-size: 24px; }
    .l-label { font-size: 10px; color: var(--orange); font-weight: 900; letter-spacing: 0.3px; }
    .l-val   { font-size: 13px; font-weight: 700; color: var(--text); word-break: keep-all; }

    /* 마무리 메시지 */
    .final-msg {
      margin-top: 20px;
      background: linear-gradient(135deg, #ff7eb3, #b17afe, #74b9ff);
      border-radius: 20px;
      padding: 18px 16px;
      text-align: center;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.9;
      word-break: keep-all;
      box-shadow: 0 6px 20px rgba(177,122,254,0.3);
      letter-spacing: 0.5px;
    }

    /* 구분선 */
    .divider {
      height: 2px;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, rgba(177,122,254,0.2), transparent);
      margin: 16px 0;
    }

    /* 다시 보기 */
    .reset-btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 16px;
      background: var(--white);
      border: 2px solid #e8d8ff;
      border-radius: 18px;
      color: var(--muted);
      font-size: 14px;
      font-family: inherit;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      touch-action: manipulation;
    }
    .reset-btn:hover  { border-color: var(--purple); color: var(--purple); background: #faf4ff; }
    .reset-btn:active { background: #f3eaff; }

    @media (min-width: 420px) {
      .score-grid { grid-template-columns: repeat(3, 1fr); }
      .score-item.full { grid-column: auto; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- 타이틀 -->
  <div class="title-area">
    <span class="title-icon">🔮</span>
    <h1>오늘의 운세</h1>
    <p class="subtitle">✨ 점성술 · 사주 · 팔자 ✨</p>
  </div>

  <!-- 입력 폼 -->
  <div class="card" id="formCard">
    <div class="form-group">
      <label>👤 이름</label>
      <input type="text" id="name" placeholder="이름을 입력하세요"
             maxlength="20" autocomplete="off" inputmode="text" />
    </div>
    <div class="form-group">
      <label>🎂 생년월일</label>
      <div class="date-row">
        <select id="byear"  aria-label="출생 연도"></select>
        <select id="bmonth" aria-label="출생 월"></select>
        <select id="bday"   aria-label="출생 일"></select>
      </div>
    </div>
    <button class="btn" onclick="showFortune()">🔮 내 운세 보기</button>
  </div>

  <!-- 결과 -->
  <div id="result">
    <div class="result-card" id="resultCard"></div>
    <button class="reset-btn" onclick="resetForm()">↺ 다시 보기</button>
  </div>

</div>
<script>
(function initDateSelects() {
  const yEl = document.getElementById('byear');
  const mEl = document.getElementById('bmonth');
  const dEl = document.getElementById('bday');

  for (let y = new Date().getFullYear(); y >= 1930; y--) {
    yEl.add(new Option(y + '년', y));
  }
  yEl.value = 1990;

  for (let m = 1; m <= 12; m++) mEl.add(new Option(m + '월', m));

  function fillDays() {
    const max = new Date(+yEl.value, +mEl.value, 0).getDate();
    const cur = +dEl.value || 1;
    dEl.innerHTML = '';
    for (let d = 1; d <= max; d++) dEl.add(new Option(d + '일', d));
    dEl.value = Math.min(cur, max);
  }
  yEl.addEventListener('change', fillDays);
  mEl.addEventListener('change', fillDays);
  fillDays();
})();

const 직업문구 = [
  '탁월한 능력이 빛을 발하여 주변의 인정과 칭찬이 쏟아지는 시기입니다.',
  '노력이 빛나는 결실로 돌아와 새로운 기회의 문이 활짝 열립니다.',
  '관록성(官祿星)이 밝게 빛나 승진·합격·성공의 좋은 소식이 들려옵니다.',
  '창의적 아이디어가 폭발하여 주변을 이끄는 리더로 도약하는 때입니다.',
  '하늘이 주신 재능이 만개하여 커다란 성취를 이루는 황금기입니다.',
];

function pick(arr, seed) { return arr[Math.abs(seed) % arr.length]; }

function hashCode(str) {
  let h = 0;
  for (const c of str) h = (Math.imul(31, h) + c.charCodeAt(0)) | 0;
  return Math.abs(h);
}

function getStar(month, day) {
  const md = month * 100 + day;
  if (md >= 1222 || md <= 119) return 0;
  if (md <= 218) return 1;  if (md <= 320) return 2;
  if (md <= 419) return 3;  if (md <= 520) return 4;
  if (md <= 620) return 5;  if (md <= 722) return 6;
  if (md <= 822) return 7;  if (md <= 922) return 8;
  if (md <= 1022) return 9; if (md <= 1121) return 10;
  return 11;
}

function getGanzhi(year) {
  const diff = year - 1984;
  const tIdx = ((diff % 10) + 10) % 10;
  const eIdx = ((diff % 12) + 12) % 12;
  return { 천: 천간[tIdx], 지: 지지[eIdx], 띠: 띠[eIdx], 아이콘: 띠아이콘[eIdx] };
}

function getOhaeng(year) {
  const b = ((year - 1984) % 10 + 10) % 10;
  return [['🌳','목(木)'],['🌳','목(木)'],['🔥','화(火)'],['🔥','화(火)'],
          ['🌍','토(土)'],['🌍','토(土)'],['💎','금(金)'],['💎','금(金)'],
          ['💧','수(水)'],['💧','수(水)']][b];
}

const scoreColors = ['#b17afe','#74b9ff','#55c9a0','#f9a825','#ff7eb3'];

function showFortune() {
  const name  = document.getElementById('name').value.trim();
  const year  = +document.getElementById('byear').value;
  const month = +document.getElementById('bmonth').value;
  const day   = +document.getElementById('bday').value;

  if (!name)  { alert('이름을 입력해 주세요! 😊'); return; }
  if (!year)  { alert('생년월일을 선택해 주세요! 🎂'); return; }

  const seed = hashCode(name + year + month + day);
  const gz   = getGanzhi(year);
  const oh   = getOhaeng(year);
  const star = 별자리[getStar(month, day)];

  const scores = {
    총운:   { v: 4 + (seed % 2),        full: true  },
    애정운: { v: 4 + ((seed >> 1) % 2), full: false },
    재물운: { v: 4 + ((seed >> 2) % 2), full: false },
    건강운: { v: 4 + ((seed >> 3) % 2), full: false },
    직업운: { v: 4 + ((seed >> 4) % 2), full: false },
  };

  const luckColor = pick(행운색,   seed >> 5);
  const luckNum   = pick(행운숫자, seed >> 6);
  const luckDir   = pick(행운방향, seed >> 7);

  const html = `
    <div class="result-header">
      <div class="name-badge">✨ ${name} 님의 운세 ✨</div>
      <div class="rmeta">${year}년 ${month}월 ${day}일 &nbsp;·&nbsp; ${gz.아이콘} ${gz.띠}띠</div>
    </div>

    <div class="ganzhi-row">
      <div class="pillar">
        <div class="pillar-label">연주(年柱)</div>
        <div class="pillar-char">${gz.천.charAt(0)}</div>
        <div class="pillar-sub">${gz.지.charAt(0)}</div>
      </div>
      <div class="pillar">
        <div class="pillar-label">오행(五行)</div>
        <div class="pillar-char">${oh[0]}</div>
        <div class="pillar-sub">${oh[1]}</div>
      </div>
      <div class="pillar">
        <div class="pillar-label">띠</div>
        <div class="pillar-char">${gz.아이콘}</div>
        <div class="pillar-sub">${gz.띠}띠</div>
      </div>
    </div>

    <div class="zodiac-row">
      <span class="zodiac-icon">${star.icon}</span>
      <div class="zodiac-info">
        <div class="sign">${star.name}</div>
        <div class="sign-date">📅 ${star.dates}</div>
        <div class="sign-desc">${star.trait} 기운을 타고난 별자리</div>
      </div>
    </div>

    <p class="section-title">— 오늘의 운세 —</p>

    <div class="fortune-list">
      <div class="fortune-item total">
        <span class="fortune-emoji">🌟</span>
        <div class="fortune-text-wrap">
          <div class="fortune-label">총운(總運)</div>
          <div class="fortune-text">${pick(총운문구, seed)}</div>
        </div>
      </div>
      <div class="fortune-item love">
        <span class="fortune-emoji">💕</span>
        <div class="fortune-text-wrap">
          <div class="fortune-label">애정운</div>
          <div class="fortune-text">${pick(애정문구, seed >> 8)}</div>
        </div>
      </div>
      <div class="fortune-item money">
        <span class="fortune-emoji">💰</span>
        <div class="fortune-text-wrap">
          <div class="fortune-label">재물운</div>
          <div class="fortune-text">${pick(재물문구, seed >> 10)}</div>
        </div>
      </div>
      <div class="fortune-item health">
        <span class="fortune-emoji">🌿</span>
        <div class="fortune-text-wrap">
          <div class="fortune-label">건강운</div>
          <div class="fortune-text">${pick(건강문구, seed >> 12)}</div>
        </div>
      </div>
      <div class="fortune-item career">
        <span class="fortune-emoji">🏆</span>
        <div class="fortune-text-wrap">
          <div class="fortune-label">직업운</div>
          <div class="fortune-text">${pick(직업문구, seed >> 14)}</div>
        </div>
      </div>
    </div>

    <p class="section-title" style="margin-top:20px">— 운세 점수 —</p>

    <div class="score-grid">
      ${Object.entries(scores).map(([k, {v, full}]) => `
        <div class="score-item${full ? ' full' : ''}">
          <div class="s-label">${k}</div>
          <div class="s-val" style="color:${scoreColors[v-1]}">${v * 20}점</div>
          <div class="s-bar"><div class="s-bar-fill" style="width:${v*20}%"></div></div>
        </div>
      `).join('')}
    </div>

    <p class="section-title" style="margin-top:20px">— 오늘의 행운 아이템 —</p>

    <div class="lucky-grid">
      <div class="lucky-item">
        <span class="l-icon">🎨</span>
        <span class="l-label">행운의 색</span>
        <span class="l-val">${luckColor}</span>
      </div>
      <div class="lucky-item">
        <span class="l-icon">🔢</span>
        <span class="l-label">행운의 숫자</span>
        <span class="l-val">${luckNum}</span>
      </div>
      <div class="lucky-item">
        <span class="l-icon">🧭</span>
        <span class="l-label">행운의 방향</span>
        <span class="l-val">${luckDir}</span>
      </div>
    </div>

    <div class="final-msg">
      🌈 ${name} 님, 오늘도 정말 빛나는 하루 보내세요! 🌈<br>
      행복과 행운이 언제나 함께하길 바랍니다 💖
    </div>
  `;

  const resultEl = document.getElementById('result');
  document.getElementById('resultCard').innerHTML = html;
  resultEl.style.display = 'block';

  const card = document.querySelector('.result-card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = '';

  setTimeout(() => resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
}

function resetForm() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('formCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.getElementById('name').focus();
}
</script>
</body>
</html>
