<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f0f4ff" />
  <title>🧠 IQ 테스트</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

    :root {
      --blue:   #4f8ef7;
      --purple: #8b5cf6;
      --mint:   #10b981;
      --pink:   #f472b6;
      --yellow: #f59e0b;
      --red:    #ef4444;
      --bg:     #f0f4ff;
      --white:  #ffffff;
      --text:   #1e1b4b;
      --muted:  #6b7280;
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100dvh;
      background: linear-gradient(160deg, #e8f0fe 0%, #ede9fe 50%, #e0f2fe 100%);
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      padding: calc(var(--safe-top) + 20px) 16px calc(var(--safe-bottom) + 40px);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 80% 10%, rgba(79,142,247,0.12) 0%, transparent 50%),
        radial-gradient(circle at 10% 80%, rgba(139,92,246,0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── 타이틀 ── */
    .title-area { text-align: center; margin-bottom: 24px; }

    .title-icon {
      font-size: 60px;
      display: block;
      margin-bottom: 10px;
      animation: pulse 2s ease-in-out infinite;
      filter: drop-shadow(0 4px 12px rgba(79,142,247,0.3));
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }

    h1 {
      font-size: clamp(24px, 7vw, 32px);
      font-weight: 900;
      background: linear-gradient(135deg, #4f8ef7, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
    }
    .subtitle { margin-top: 6px; font-size: 13px; color: var(--muted); letter-spacing: 1px; }

    /* ── 시작 카드 ── */
    .card {
      background: var(--white);
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 8px 32px rgba(79,142,247,0.13), 0 2px 8px rgba(0,0,0,0.05);
      border: 2px solid rgba(79,142,247,0.12);
    }

    .intro-list {
      list-style: none;
      margin: 16px 0 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .intro-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--text);
      background: #f5f3ff;
      border-radius: 12px;
      padding: 10px 14px;
    }
    .intro-list li span { font-size: 20px; }

    .btn {
      width: 100%;
      padding: 17px;
      background: linear-gradient(135deg, #4f8ef7, #8b5cf6);
      border: none;
      border-radius: 18px;
      color: #fff;
      font-size: 17px;
      font-family: inherit;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      transition: filter 0.15s, transform 0.15s, box-shadow 0.15s;
      min-height: 56px;
      touch-action: manipulation;
      box-shadow: 0 6px 20px rgba(79,142,247,0.3);
    }
    .btn:hover  { filter: brightness(1.07); box-shadow: 0 8px 24px rgba(79,142,247,0.4); }
    .btn:active { transform: scale(0.96); filter: brightness(0.96); box-shadow: none; }

    .btn-outline {
      background: var(--white);
      border: 2px solid #d0d7ff;
      color: var(--purple);
      box-shadow: none;
      margin-top: 10px;
    }
    .btn-outline:hover { background: #f5f3ff; border-color: var(--purple); box-shadow: none; }

    /* ── 진행바 ── */
    .progress-wrap { margin-bottom: 18px; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .progress-bar {
      height: 8px;
      background: #e5e7eb;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #4f8ef7, #8b5cf6);
      transition: width 0.4s cubic-bezier(.22,.68,0,1.2);
    }

    /* ── 문제 카드 ── */
    .question-card {
      background: var(--white);
      border-radius: 28px;
      padding: 26px 20px 24px;
      box-shadow: 0 8px 32px rgba(79,142,247,0.12), 0 2px 8px rgba(0,0,0,0.05);
      border: 2px solid rgba(79,142,247,0.1);
      animation: slideIn 0.35s cubic-bezier(.22,.68,0,1.2);
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(24px) scale(0.97); }
      to   { opacity: 1; transform: translateX(0)    scale(1);    }
    }

    .q-type-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    .badge-pattern { background: #dbeafe; color: #1d4ed8; }
    .badge-number  { background: #d1fae5; color: #065f46; }
    .badge-logic   { background: #ede9fe; color: #5b21b6; }
    .badge-word    { background: #fef3c7; color: #92400e; }
    .badge-figure  { background: #fce7f3; color: #9d174d; }

    .q-text {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.7;
      color: var(--text);
      margin-bottom: 8px;
      word-break: keep-all;
    }

    .q-hint {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 16px;
      font-style: italic;
    }

    /* 도형/패턴 표시 영역 */
    .q-visual {
      background: #f8faff;
      border: 2px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 22px;
      letter-spacing: 8px;
      line-height: 1.8;
      font-weight: 700;
      color: var(--text);
      word-break: break-all;
    }

    /* 보기 */
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .choice-btn {
      padding: 14px 10px;
      background: #f8faff;
      border: 2px solid #e5e7eb;
      border-radius: 16px;
      font-size: 15px;
      font-family: inherit;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      touch-action: manipulation;
      min-height: 54px;
      word-break: keep-all;
    }
    .choice-btn:hover  { border-color: var(--blue); background: #eff6ff; }
    .choice-btn:active { transform: scale(0.95); }

    .choice-btn.selected { border-color: var(--blue); background: #dbeafe; color: #1d4ed8; }
    .choice-btn.correct  { border-color: var(--mint); background: #d1fae5; color: #065f46; }
    .choice-btn.wrong    { border-color: var(--red);  background: #fee2e2; color: #b91c1c; }
    .choice-btn:disabled { cursor: default; }

    .feedback {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      display: none;
      word-break: keep-all;
    }
    .feedback.show { display: block; animation: fadeIn 0.3s; }
    .feedback.ok  { background: #d1fae5; color: #065f46; }
    .feedback.bad { background: #fee2e2; color: #b91c1c; }

    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

    .next-btn {
      width: 100%;
      margin-top: 14px;
      padding: 15px;
      background: linear-gradient(135deg, #4f8ef7, #8b5cf6);
      border: none;
      border-radius: 16px;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      font-weight: 900;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: none;
      transition: filter 0.15s, transform 0.12s;
      touch-action: manipulation;
      min-height: 52px;
    }
    .next-btn.show   { display: block; animation: fadeIn 0.3s; }
    .next-btn:hover  { filter: brightness(1.08); }
    .next-btn:active { transform: scale(0.97); }

    /* ── 결과 카드 ── */
    .result-card {
      background: var(--white);
      border-radius: 28px;
      padding: 30px 22px;
      box-shadow: 0 8px 32px rgba(79,142,247,0.13), 0 2px 8px rgba(0,0,0,0.05);
      border: 2px solid rgba(79,142,247,0.12);
      text-align: center;
      animation: popIn 0.45s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn {
      from { opacity:0; transform: scale(0.88) translateY(16px); }
      to   { opacity:1; transform: scale(1)    translateY(0); }
    }

    .result-icon { font-size: 64px; margin-bottom: 12px; display: block; }

    .iq-score {
      font-size: clamp(52px, 15vw, 72px);
      font-weight: 900;
      background: linear-gradient(135deg, #4f8ef7, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 4px;
    }
    .iq-label { font-size: 18px; font-weight: 700; color: var(--muted); margin-bottom: 16px; }

    .iq-grade {
      display: inline-block;
      padding: 8px 24px;
      border-radius: 99px;
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .iq-desc {
      font-size: 14px;
      line-height: 1.8;
      color: #4b5563;
      background: #f5f3ff;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 20px;
      word-break: keep-all;
    }

    .score-breakdown {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .sb-item {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 99px;
      background: #e5e7eb;
      color: #374151;
    }
    .sb-item.hit { background: #d1fae5; color: #065f46; }

    .correct-count {
      font-size: 15px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .correct-count strong { color: var(--blue); font-size: 20px; }

    /* 링크 버튼 */
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      transition: filter 0.15s, transform 0.12s;
      margin-top: 10px;
      border: none;
    }
    .link-btn:active { transform: scale(0.97); }

    .link-btn.fortune {
      background: linear-gradient(135deg, #ff7eb3, #b17afe);
      color: #fff;
      box-shadow: 0 4px 16px rgba(255,126,179,0.3);
    }
    .link-btn.fortune:hover { filter: brightness(1.07); }

    .link-btn.retry {
      background: var(--white);
      border: 2px solid #d0d7ff;
      color: var(--purple);
    }
    .link-btn.retry:hover { background: #f5f3ff; }

    /* 유형별 분석 */
    .type-breakdown { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .type-item { display: grid; grid-template-columns: auto 36px 1fr; align-items: center; gap: 10px; }
    .type-label { font-size: 12px; font-weight: 700; color: var(--text); white-space: nowrap; }
    .type-score { font-size: 12px; font-weight: 900; color: var(--purple); text-align: right; }
    .type-bar { height: 8px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
    .type-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #4f8ef7, #8b5cf6); transition: width 0.8s cubic-bezier(.22,.68,0,1.2); }

    /* 섹션 숨기기 */
    #intro-section, #quiz-section, #result-section { display: none; }
    #intro-section.active, #quiz-section.active, #result-section.active { display: block; }
  </style>
</head>
<body>
<div class="container">

  <div class="title-area">
    <span class="title-icon">🧠</span>
    <h1>IQ 테스트</h1>
    <p class="subtitle">나의 두뇌 레벨은 얼마일까? 🤔</p>
  </div>

  <!-- 시작 화면 -->
  <div id="intro-section" class="active">
    <div class="card">
      <ul class="intro-list">
        <li><span>📝</span> 총 15문항 · 유형별 두뇌 측정</li>
        <li><span>⏱️</span> 제한 시간 없음 · 천천히 생각하세요</li>
        <li><span>🔢</span> 수열 · 패턴 · 논리 · 언어 유추</li>
        <li><span>🎯</span> 점수에 따라 IQ 지수 산출</li>
      </ul>
      <button class="btn" onclick="startQuiz()">🚀 테스트 시작하기</button>
      <a href="fortune.html" class="btn btn-outline" style="display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;margin-top:10px;padding:15px;border-radius:18px;font-size:15px;font-weight:700;letter-spacing:1px;">
        🔮 오늘의 운세 보러가기
      </a>
    </div>
  </div>

  <!-- 퀴즈 화면 -->
  <div id="quiz-section">
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="q-counter">1 / 15</span>
        <span id="q-type-label"></span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <div class="question-card" id="question-card">
      <span class="q-type-badge" id="q-badge"></span>
      <div class="q-text"  id="q-text"></div>
      <div class="q-hint"  id="q-hint"></div>
      <div class="q-visual" id="q-visual" style="display:none"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">다음 문제 →</button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="result-section">
    <div class="result-card">
      <span class="result-icon" id="result-icon"></span>
      <div class="iq-score" id="iq-score"></div>
      <div class="iq-label">예상 IQ 지수</div>
      <span class="iq-grade" id="iq-grade"></span>
      <div class="iq-desc"  id="iq-desc"></div>
      <div class="correct-count" id="correct-count"></div>
      <div class="score-breakdown" id="score-breakdown"></div>
      <a href="fortune.html" class="link-btn fortune">🔮 오늘의 운세도 확인해보기</a>
      <button class="link-btn retry" onclick="restartQuiz()">↺ 다시 테스트하기</button>
    </div>
  </div>

</div>
<script>
// ── 문제 풀 (35문항, 중2 수준) ──────────────────────────
const POOL = [

  /* ════ 수열 추론 (9문항) ════ */
  {
    type:'number', badge:'badge-number', label:'수열 추론',
    text:'빈칸에 알맞은 수는?',
    visual:'3 · 7 · 13 · 21 · 31 · __',
    hint:'증가하는 차이를 살펴보세요.',

    explain:'차이: +4,+6,+8,+10,+12 → 31+12=43'

    type:'number', badge:'badge-number', label:'수열 추론',

    hint:'앞 두 항을 더하면 다음 항이 됩니다.',
    choices:['29','33','34','35'], answer:2,
    explain:'피보나치 수열: 13+21=34'
  },
  {
    type:'number', badge:'badge-number', label:'수열 추론',

    explain:'Z→X→V→T→R→P (2칸씩 역순)'

  {
    type:'pattern', badge:'badge-pattern', label:'패턴 추론',
    text:'빈칸에 알맞은 수는?',
    visual:'2 · 4 · 3 · 6 · 5 · 10 · 9 · __',
    hint:'×2 후 -1이 반복되는 패턴입니다.',

    explain:'×2, -1 반복: 9×2=18'
  },
  {
    type:'pattern', badge:'badge-pattern', label:'패턴 추론',
    text:'규칙을 찾아 빈칸에 알맞은 것을 고르세요.',
    visual:'🔺🔺🔵 🔺🔺🔵 🔺🔺__',
    hint:'세트 단위로 반복되는 패턴을 찾으세요.',
    choices:['🔺','🔵','🟡','🟢'], answer:1,
    explain:'🔺🔺🔵 패턴이 반복됩니다.'
  },
  {
    type:'pattern', badge:'badge-pattern', label:'패턴 추론',

const QUIZ_COUNT = 15;
let quiz     = [];   // 랜덤 선택된 15문항
let currentQ = 0;
let score    = 0;
let answered = false;
let results  = [];

// Fisher-Yates shuffle + 앞 N개 추출
function sampleQuestions(pool, n) {
  const arr = [...pool];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr.slice(0, n);
}

function startQuiz() {
  quiz     = sampleQuestions(POOL, QUIZ_COUNT);
  currentQ = 0; score = 0; answered = false; results = [];
  show('quiz-section');
  renderQuestion();
}

function renderQuestion() {
  const q = quiz[currentQ];
  answered = false;

  document.getElementById('q-counter').textContent    = `${currentQ + 1} / ${QUIZ_COUNT}`;
  document.getElementById('q-type-label').textContent = q.label;
  document.getElementById('progress-fill').style.width = `${(currentQ / QUIZ_COUNT) * 100}%`;

  const badge = document.getElementById('q-badge');
  badge.textContent = q.label;
  badge.className   = `q-type-badge ${q.badge}`;

  document.getElementById('q-text').textContent = q.text;

  const hint = document.getElementById('q-hint');
  hint.textContent  = q.hint || '';
  hint.style.display = q.hint ? 'block' : 'none';

  const visual = document.getElementById('q-visual');
  if (q.visual) {
    visual.innerHTML    = q.visual;
    visual.style.display = 'block';
  } else {
    visual.style.display = 'none';
  }

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = c;
    btn.onclick   = () => selectAnswer(i);
    choicesEl.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';

  const nb = document.getElementById('next-btn');
  nb.className  = 'next-btn';
  nb.textContent = currentQ < QUIZ_COUNT - 1 ? '다음 문제 →' : '결과 보기 🎉';

  const card = document.getElementById('question-card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = '';
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;

  const q  = quiz[currentQ];
  const ok = idx === q.answer;
  if (ok) score++;
  results.push({ correct: ok, label: q.label });

  document.querySelectorAll('.choice-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === q.answer)        b.classList.add('correct');
    else if (i === idx && !ok) b.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  fb.textContent = ok ? `✅ 정답! ${q.explain}` : `❌ 오답. ${q.explain}`;
  fb.className   = `feedback show ${ok ? 'ok' : 'bad'}`;

  document.getElementById('next-btn').classList.add('show');
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= QUIZ_COUNT) {
    showResult();
  } else {
    renderQuestion();
    document.getElementById('question-card').scrollIntoView({ behavior:'smooth', block:'start' });
  }
}

function showResult() {
  const pct = score / QUIZ_COUNT;
  let iq;
  if      (pct >= 14/15) iq = 145;
  else if (pct >= 13/15) iq = 138;
  else if (pct >= 12/15) iq = 132;
  else if (pct >= 11/15) iq = 125;
  else if (pct >= 10/15) iq = 118;
  else if (pct >=  9/15) iq = 112;
  else if (pct >=  8/15) iq = 107;
  else if (pct >=  7/15) iq = 103;
  else if (pct >=  6/15) iq = 99;
  else if (pct >=  5/15) iq = 95;
  else                   iq = 90;

  const grades = [
    { min:140, icon:'🏆', label:'천재 수준',  bg:'#fef3c7', fg:'#92400e' },
    { min:130, icon:'🌟', label:'최우수',      bg:'#ede9fe', fg:'#5b21b6' },
    { min:120, icon:'🎯', label:'우수',        bg:'#d1fae5', fg:'#065f46' },
    { min:110, icon:'😊', label:'평균 이상',   bg:'#dbeafe', fg:'#1d4ed8' },
    { min:100, icon:'👍', label:'평균',        bg:'#fee2e2', fg:'#b91c1c' },
    { min:0,   icon:'📚', label:'노력형 두뇌', bg:'#ffedd5', fg:'#9a3412' },
  ];
  const descs = {
    '천재 수준':  '놀라운 두뇌입니다! 중2 수준의 복잡한 문제를 거의 완벽히 해결하는 최상위 두뇌를 가졌습니다. 논리력과 수리 추론 능력이 탁월합니다.',
    '최우수':     '매우 뛰어난 두뇌입니다! 수열·논리·공간 추론에서 높은 수준을 보여줬습니다. 상위 2~5% 수준의 두뇌입니다.',
    '우수':       '훌륭한 두뇌를 가졌습니다! 논리적 사고와 패턴 인식 능력이 뛰어나며, 어떤 분야든 빠르게 적응할 수 있습니다.',
    '평균 이상':  '두뇌 회전이 빠릅니다! 평균보다 높은 수리·언어 추론 능력을 가지고 있습니다. 꾸준히 연습하면 더욱 성장할 수 있어요.',
    '평균':       '균형 잡힌 두뇌입니다! 대부분의 문제를 안정적으로 해결하는 능력을 가졌습니다. 취약한 유형을 집중 연습하면 점수가 올라갑니다.',
    '노력형 두뇌':'아직 성장 중인 두뇌! 어려운 문제에 도전한 것만으로도 대단합니다. 꾸준한 연습으로 반드시 성장할 수 있습니다. 화이팅!',
  };

  const g = grades.find(x => iq >= x.min);
  document.getElementById('result-icon').textContent = g.icon;
  document.getElementById('iq-score').textContent    = iq;

  const gradeEl = document.getElementById('iq-grade');
  gradeEl.textContent      = g.label;
  gradeEl.style.background = g.bg;
  gradeEl.style.color      = g.fg;

  document.getElementById('iq-desc').textContent     = descs[g.label];
  document.getElementById('correct-count').innerHTML =
    `15문제 중 <strong>${score}문제</strong> 정답`;

  // 유형별 분석
  const typeMap = {};
  results.forEach(r => {
    if (!typeMap[r.label]) typeMap[r.label] = { hit:0, total:0 };
    typeMap[r.label].total++;
    if (r.correct) typeMap[r.label].hit++;
  });
  const typeHTML = Object.entries(typeMap).map(([label, {hit, total}]) =>
    `<div class="type-item">
      <span class="type-label">${label}</span>
      <span class="type-score">${hit}/${total}</span>
      <div class="type-bar"><div class="type-bar-fill" style="width:${Math.round(hit/total*100)}%"></div></div>
    </div>`
  ).join('');

  document.getElementById('score-breakdown').innerHTML =
    `<div class="type-breakdown">${typeHTML}</div>`;

  show('result-section');
  document.querySelector('.container').scrollIntoView({ behavior:'smooth', block:'start' });
}

function restartQuiz() { show('intro-section'); }

function show(id) {
  ['intro-section','quiz-section','result-section'].forEach(s =>
    document.getElementById(s).classList.remove('active')
  );
  document.getElementById(id).classList.add('active');
}
